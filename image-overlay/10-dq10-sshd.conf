# DQ10: key-only root login. Installed as 00-dq10.conf so it is read before sshd_config's own
# "PermitRootLogin yes" (sshd keeps the FIRST value it sees; the Include is at the top of sshd_config).
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
